services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bank_demo
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - bank_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_demo"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bank:${DB_PASSWORD}@db:5432/bank_demo
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
volumes:
  bank_data:
